name: Daily Credit Monitor

on:
  # 사내 PC 예약 작업이 월~금 08:15에 NICE 원본을 넣어 호출하고(NICE가 해외 IP를 막음),
  # Vultr systemd timer가 08:27에 예비로 호출한다. 예비 호출은 오늘 이미 정상 완료된
  # 실행이 있으면 건너뛴다. GitHub schedule은 장시간 지연될 수 있어 사용하지 않는다.
  workflow_dispatch:        # 사내 PC, Vultr 및 수동 실행
    inputs:
      nice_disclosures:
        description: '국내에서 수집한 NICE 공시 4종 (사내 PC 예약 작업이 넣음)'
        required: false
        type: string
      force_run:
        description: '오늘 이미 정상 완료된 실행이 있어도 다시 실행'
        required: false
        default: false
        type: boolean
      nice_backfill_only:
        description: '수동 보충만 실행 (검증된 NICE 원본 4종 필요, 자동 수집 경고 유지)'
        required: false
        default: false
        type: boolean
      nice_watch_snapshot:
        description: '수동 장애 복구 전용: 검증할 ops/recovery/ 아래 NICE Watch 원본 JSON 파일명'
        required: false
        default: ''
        type: string

permissions:
  contents: write        # 전송 이력(state/sent.json) 커밋에 필요

concurrency:
  group: credit-monitor
  cancel-in-progress: false   # 중복 실행 방지. 겹치면 같은 건이 두 번 발송된다.

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20        # 재시도(3회 x 30초 대기)를 감안해도 충분

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 누락 방지 회귀 테스트
        run: python -m unittest discover -s tests -q

      - name: 모니터 실행
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NICE_WATCH_SNAPSHOT: ${{ inputs.nice_watch_snapshot }}
          NICE_DISCLOSURES: ${{ inputs.nice_disclosures }}
          NICE_BACKFILL_ONLY: ${{ inputs.nice_backfill_only }}
          FORCE_RUN: ${{ inputs.force_run }}
        run: |
          if [ "$NICE_BACKFILL_ONLY" = "true" ]; then
            python ops/recover_nice_watch.py --bundle
          elif [ -n "$NICE_WATCH_SNAPSHOT" ]; then
            python ops/recover_nice_watch.py "$NICE_WATCH_SNAPSHOT"
          else
            python credit_monitor_daily.py
          fi

      # 전송에 성공한 건만 이력에 쌓인다. 이걸 커밋해 둬야 내일 실행에서
      # 같은 건이 다시 발송되지 않는다. 실행이 실패했어도 그때까지 보낸
      # 건은 기록으로 남겨야 하므로 always() 로 돌린다.
      - name: 전송 이력 커밋
        if: always()
        run: |
          if [ ! -f state/sent.json ]; then
            echo "저장된 이력이 없습니다."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f 로 강제한다. 이 파일들은 반드시 추적돼야 하는데, .gitignore 에
          # state/ 가 들어가면 git add 가 오류로 끝나 스텝이 통째로 실패한다.
          # history.json 은 웹 리포트의 원본이라 같이 남겨야 화면이 쌓인다.
          git add -f state/sent.json state/history.json
          if [ -f state/health.json ]; then git add -f state/health.json; fi
          if git diff --staged --quiet; then
            echo "변경 없음."; exit 0
          fi
          git commit -m "Update history ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push

      # 휴대폰에서 보는 화면. 텔레그램은 '새 소식'을 알리고, 이 페이지는
      # '지금까지 무슨 일이 있었나'를 본다.
      - name: 페이지용 폴더 구성
        if: always() && steps.run.outputs.report_ready == 'true'
        run: |
          test -s report.html || { echo "report.html 이 비어 있음"; exit 1; }
          mkdir -p public
          cp report.html public/index.html
          cp apple-touch-icon.png favicon.png icon-512.png public/
          ls -l public/

      - name: GitHub Pages 로 배포
        if: always() && steps.run.outputs.report_ready == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages

      # 스크립트가 통째로 죽으면 텔레그램이 안 간다. 침묵은 '변동 없음'과
      # 구분되지 않으므로 실패 자체를 알린다.
      - name: 실패 알림
        if: failure() && steps.run.outputs.failure_handled != 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TG_TOKEN="$(printf '%s' "$TG_TOKEN" | tr -d '[:space:]')"
          TG_CHAT="$(printf '%s' "$TG_CHAT" | tr -d '[:space:]')"
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "텔레그램 시크릿이 없어 실패 알림을 건너뜁니다."; exit 0
          fi
          TEXT="⚠️ [신용등급 모니터링] 실행 실패
          브리핑이 발송되지 않았습니다. 등급 변동이 없다는 뜻이 아닙니다.
          $RUN_URL"
          curl -sS -o /dev/null -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" || true
